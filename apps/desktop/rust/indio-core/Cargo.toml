[package]
name = "indio-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for the IndioTube desktop app: stream ladder, download queue, byte ranges."

[lib]
name = "indio_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
