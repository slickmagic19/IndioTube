[package]
name = "indiotube-shell"
version = "0.1.38"
edition = "2021"
description = "IndioTube desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
indio-core = { path = "../rust/indio-core" }

[[bin]]
name = "IndioTube"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
